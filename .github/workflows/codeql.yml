# Requires Code Security (code scanning) to be enabled on the repository:
# Settings -> Code security. Without it every run ends as a configuration
# error — "Code Security must be enabled for this repository to use code
# scanning" — no matter what this file says. It is free on public
# repositories; on a private one it needs GitHub Advanced Security.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # github/codeql-action reads the workflow run it is part of (GET
  # /repos/{owner}/{repo}/actions/runs/{run_id}). Without `actions: read` that
  # call 403s with "Resource not accessible by integration" and the job ends as
  # a configuration error even though the analysis itself succeeded.
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
