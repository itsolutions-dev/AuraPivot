name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # github/codeql-action reads the workflow run it is part of (GET
  # /repos/{owner}/{repo}/actions/runs/{run_id}). Without `actions: read` that
  # call 403s with "Resource not accessible by integration" and the job ends as
  # a configuration error even though the analysis itself succeeded.
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
